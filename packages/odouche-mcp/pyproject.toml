[project]
name = "odouche-mcp"
version = "0.0.0" # x-release-please-version
description = "An unofficial Model Context Protocol server for Odoo.sh"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Avanserv", email = "avs@avanserv.com" }
]
requires-python = ">=3.12"
keywords = ["odoo", "odoo.sh", "mcp", "model-context-protocol"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.2.0",
    # Exact, because the three packages are released together and tested only together.
    "odouche==0.0.0", # x-release-please-version
]

[project.scripts]
odouche-mcp = "odouche_mcp.server:main"

[project.urls]
Homepage = "https://github.com/avanserv/odouche"
Documentation = "https://avanserv.github.io/odouche/"
Issues = "https://github.com/avanserv/odouche/issues"
Changelog = "https://github.com/avanserv/odouche/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.11,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
odouche = { workspace = true }

# The server has no tools yet, so nothing in it imports the library it exists to expose. Delete
# this block with the first tool: from then on an unused `odouche` would be a real finding.
[tool.deptry.per_rule_ignores]
DEP002 = ["odouche"]
