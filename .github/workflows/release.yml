name: Release

on:
  push:
    branches:
      - main

# Nothing by default; each job below names what it holds and why.
permissions: {}

# One at a time and never cancelled: a run interrupted between tagging and publishing would leave
# a release on GitHub that PyPI never received.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The job's own token writes nothing: everything below goes through the release App's token.
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The release App rather than the job's own token: GitHub holds the workflows of a pull
      # request that token opens until someone approves them, so the release pull request would
      # never get its CI unattended.
      - name: Generate the release App token
        uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          # Named rather than left blank, because blank means every permission the installation
          # holds. A permission it does not hold fails the token request itself.
          permission-contents: write # the tag, the GitHub release, the lockfile commit
          permission-pull-requests: write # opens and updates the release pull request

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

      # Release Please rewrites the version in the four manifests and knows nothing of uv.lock,
      # which records the same versions. Left alone the release branch fails `uv sync --locked`,
      # so the lockfile is brought back in step on the branch before anyone merges it.
      - name: Checkout the release branch
        if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).headBranchName || '' }}
          # The push below is the whole reason for this checkout, so the credential stays.
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Setup uv
        if: ${{ steps.release.outputs.pr }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No cache in a workflow that holds the release App's key and publishes: a cache is
          # writable by any job that can reach the same key.
          enable-cache: false

      - name: Sync the lockfile
        if: ${{ steps.release.outputs.pr }}
        run: |
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already matches the release version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync uv.lock with the release version" -- uv.lock
          git push

  publish:
    name: Publish ${{ matrix.package }} to PyPI
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One job and one environment per project, because PyPI ties a trusted publisher to the
    # (repository, workflow, environment) it names. Before a project exists, a publisher that is
    # still pending can stand for one project only, so three projects behind one environment could
    # never be published a first time. It also keeps each job's upload credential scoped to the
    # one project that job builds.
    strategy:
      # A leg that fails must not cancel the uploads of the others: PyPI cannot take a version
      # back, and re-running the failed leg is how a half-published release is completed.
      fail-fast: false
      matrix:
        include:
          - package: odouche
            environment: pypi
          - package: odouche-cli
            environment: pypi-cli
          - package: odouche-mcp
            environment: pypi-mcp
    environment:
      name: ${{ matrix.environment }}
      url: https://pypi.org/project/${{ matrix.package }}/
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing: the upload is authorised by this job's identity
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false # see the note in the job above

      # Only this leg's package, so dist/ holds nothing its credential is not meant for.
      - name: Build the distributions
        env:
          PACKAGE: ${{ matrix.package }}
        run: uv build --package "$PACKAGE"

      # No token anywhere: PyPI trusts this workflow in this environment for this project, and
      # exchanges the job's OIDC identity for a short-lived upload credential.
      - name: Publish
        run: uv publish --trusted-publishing always
