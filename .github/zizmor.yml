# What the workflow security audit is allowed to let through, and why. Nothing is disabled here:
# an exception is taken on the line that needs it, with `# zizmor: ignore[rule]` and the reason
# beside it, so it cannot outlive the code it excuses.

rules:
  # GitHub's own actions may be referenced by tag; everyone else must be pinned to a commit. The
  # asymmetry is the point: a tag is a mutable pointer, and for `actions/*` and `github/*` the
  # owner is GitHub, which already runs the job. .github/dependabot.yml keeps the third-party pins
  # current.
  unpinned-uses:
    config:
      policies:
        actions/*: ref-pin
        github/*: ref-pin
        "*": hash-pin
